name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch and publish Analytics
        run: node scripts/fetch-analytics.mjs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}
      - name: Install optional yt-dlp provider
        run: |
          python -m pip install --user yt-dlp || echo "yt-dlp installation failed; its supplemental signals will be skipped"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch supplemental signals
        run: node scripts/fetch-supplemental.mjs
        env:
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}
          INVIDIOUS_INSTANCES: ${{ vars.INVIDIOUS_INSTANCES }}
          INVIDIOUS_REGIONS: ${{ vars.INVIDIOUS_REGIONS }}
          YTDLP_SUB_LANGS: ${{ vars.YTDLP_SUB_LANGS }}
          SUPPLEMENTAL_VIDEO_LIMIT: "10"
      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' --exclude '*.zip' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
